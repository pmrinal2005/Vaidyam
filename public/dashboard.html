<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Catena — Personal Causal Health Twin</title>
<meta name="description" content="Catena builds a continuously-updating causal model of an individual and reasons across medication, sleep, environment, mental health and nutrition at near-zero cost — with zero-knowledge attestations and differentially-private aggregation." />
<meta name="theme-color" content="#07080a" />
<meta name="robots" content="noindex" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="/static/dashboard.css" />
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
<link rel="preconnect" href="https://air-quality-api.open-meteo.com" crossorigin />
</head>
<body class="dash-body">

<a class="dash-skip" href="#dash-main">Skip to dashboard content</a>

<div id="dash-shell" class="dash-shell">

  <!-- ICON RAIL -->
  <aside id="dash-rail" class="dash-rail" aria-label="Dashboard sections">
    <a class="rail-logo" href="/" aria-label="Back to SynapseX landing page">
      <span class="rail-logo-mark" aria-hidden="true"></span>
    </a>
    <nav id="rail-nav" class="rail-nav" aria-label="Views"></nav>
    <div class="rail-foot">
      <button type="button" id="rail-refresh" class="rail-btn" aria-label="Refresh live data" title="Refresh live data">
        <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
      </button>
      <a class="rail-btn" href="/" aria-label="Exit dashboard" title="Exit to landing page">
        <i class="bi bi-box-arrow-left" aria-hidden="true"></i>
      </a>
    </div>
  </aside>

  <!-- MOBILE NAV OVERLAY -->
  <div id="dash-scrim" class="dash-scrim" hidden></div>

  <div class="dash-frame">
    <!-- TOP BAR -->
    <header id="dash-topbar" class="dash-topbar">
      <button type="button" id="dash-menu-btn" class="topbar-icon-btn" aria-label="Open navigation" aria-expanded="false" aria-controls="dash-rail">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>

      <div class="topbar-title">
        <p class="topbar-eyebrow" id="topbar-eyebrow">Catena</p>
        <h1 class="topbar-heading" id="topbar-heading">Overview</h1>
      </div>

      <div class="topbar-search">
        <i class="bi bi-search" aria-hidden="true"></i>
        <input type="search" id="graph-query-input" placeholder="Ask the twin — e.g. why is my sleep affecting my BP?" aria-label="Query the causal graph and agent swarm" />
      </div>

      <div class="topbar-right">
        <div class="live-chip" id="live-chip" title="Live data source status">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="live-chip-text">connecting</span>
        </div>
        <div class="topbar-user">
          <span class="user-avatar" aria-hidden="true">CT</span>
          <span class="user-meta">
            <span class="user-name" id="user-name">Primary Twin</span>
            <span class="user-sub" id="user-sub">graph —</span>
          </span>
        </div>
      </div>
    </header>

    <!-- PROVENANCE STRIP -->
    <div id="prov-strip" class="prov-strip" aria-live="polite"></div>

    <!-- MAIN -->
    <main id="dash-main" class="dash-main" tabindex="-1">
      <div id="view-root" class="view-root"></div>
    </main>

    <!-- MOBILE TAB BAR -->
    <nav id="dash-tabbar" class="dash-tabbar" aria-label="Quick views"></nav>
  </div>
</div>

<div id="dash-toast" class="dash-toast" role="status" aria-live="polite"></div>

<script src="/static/dash/core.js" defer></script>
<script src="/static/dash/charts.js" defer></script>
<script src="/static/dash/views-core.js" defer></script>
<script src="/static/dash/views-reason.js" defer></script>
<script src="/static/dash/views-domain.js" defer></script>
<script src="/static/dash/views-privacy.js" defer></script>
<script src="/static/dash/app.js" defer></script>
</body>
</html>
